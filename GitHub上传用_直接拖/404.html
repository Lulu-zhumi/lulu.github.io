<!DOCTYPE html>
<html lang="en" data-lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 · Page not found</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/style.css">
  <script>
    (function () {
      var s = null;
      try { s = localStorage.getItem('academic-home-lang'); } catch (e) {}
      var l = s || ((navigator.language || '').toLowerCase().indexOf('zh') === 0 ? 'zh' : 'en');
      document.documentElement.setAttribute('data-lang', l === 'zh' ? 'zh' : 'en');
      document.documentElement.lang = l === 'zh' ? 'zh-CN' : 'en';
    })();
  </script>
  <style>
    .nf { min-height: 66vh; display: grid; place-content: center; text-align: center; gap: 10px; padding: 40px 24px; }
    .nf code { font-family: var(--mono); font-size: .82rem; color: var(--faint); }
    .nf h1 { margin: 0; border: 0; padding: 0; font-size: clamp(1.8rem, 4vw, 2.4rem); }
    .nf p { margin: 0; color: var(--muted); font-size: .95rem; }
  </style>
</head>
<body>
  <main class="nf">
    <code>404</code>
    <h1>
      <span class="i18n" data-lang="en">Page not found</span>
      <span class="i18n" data-lang="zh">页面不存在</span>
    </h1>
    <p>
      <span class="i18n" data-lang="en">This link may have moved. Back to the <a href="index.html">homepage</a>.</span>
      <span class="i18n" data-lang="zh">链接可能已变更，返回<a href="index.html">首页</a>。</span>
    </p>
  </main>
</body>
</html>
